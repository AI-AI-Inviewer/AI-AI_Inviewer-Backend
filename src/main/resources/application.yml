server:
  port: 10002

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/xe}
    username: ${DB_USERNAME:DONGYANG}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.Oracle10gDialect
    show-sql: true

jwt:
  secret: ${JWT_SECRET:change-me-in-prod}

openai:
  api-key: ${OPENAI_API_KEY:}
