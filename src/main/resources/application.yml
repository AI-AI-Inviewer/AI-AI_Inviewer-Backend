server:
  port: 10002
  servlet:
    context-path: /
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/xe}
    username: ${DB_USERNAME:DONGYANG}
    password: ${DB_PASSWORD:1234}
    hikari:
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: false
  mail:
    host: mail            # docker-mailserver 컨테이너 이름
    port: 587
    username: no-reply@aiinviewer.co.kr
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.trust: "mail"  # 또는 "*" (와일드카드)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: "+00:00"
        dialect: org.hibernate.community.dialect.OracleLegacyDialect
    show-sql: true

elevenlabs:
  base-url: https://api.elevenlabs.io
  api-key: ${ELEVENLABS_API_KEY}
  #  project-id: K5GMjJiqLM5Ki9JHJEBG
  model-id: eleven_multilingual_v2
  default-voice-id: 21m00Tcm4TlvDq8ikWAM
  output-format: mp3_44100_128
jwt:
  secret: ${JWT_SECRET:change-me-in-prod}

openai:
  api-key: ${OPENAI_API_KEY:}

logging:
  level:
    org.springframework.security: DEBUG
app:
  mail:
    from: no-reply@aiinviewer.co.kr
    from-name: AI Interviewer